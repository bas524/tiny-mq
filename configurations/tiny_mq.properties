# This is a sample configuration file.
logging.channels.cScreen.class=ColorConsoleChannel
logging.channels.cScreen.formatter.class=PatternFormatter
logging.channels.cScreen.formatter.pattern=%Y-%m-%d %H:%M:%S:%i #%q [%I %T] - %t
logging.channels.cScreen.formatter.times=UTC
logging.channels.cScreen.traceColor=lightBlue
logging.channels.cScreen.debugColor=blue
logging.channels.cScreen.informationColor=white
logging.channels.cScreen.noticeColor=green
logging.channels.cScreen.warningColor=yellow
logging.channels.cScreen.errorColor=red
logging.channels.cScreen.criticalColor=lightMagenta
logging.channels.cScreen.fatalColor=lightMagenta
logging.channels.cFile.class=FileChannel
logging.channels.cFile.path=${application.dir}tiny_mq.log
logging.channels.cFile.rotation=100M
logging.channels.cFile.archive=number
logging.channels.cFile.purgeCount=5
logging.channels.cFile.formatter.class=PatternFormatter
logging.channels.cFile.formatter.pattern=%Y-%m-%d %H:%M:%S:%i #%q [%I %T] - %t
logging.channels.cFile.formatter.times=UTC
logging.channels.splitter.class=SplitterChannel
logging.channels.splitter.channels=cFile,cScreen
logging.channels.async.class=AsyncChannel
logging.channels.async.channel=splitter
logging.channels.async.priority=lowest
logging.loggers.root.name=tiny_mq
logging.loggers.root.channel=async
logging.loggers.root.level=error

